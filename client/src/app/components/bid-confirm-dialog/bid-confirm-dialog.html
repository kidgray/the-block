<h2 mat-dialog-title>Confirm your bid</h2>
<mat-dialog-content>
  <p class="amount">{{ data.amount | cad }}</p>
  <p>on the {{ data.vehicleTitle }}</p>
  <p class="note">
    Bids are binding. If someone else bids before yours arrives, it won't be placed and you'll see
    the new price.
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">Cancel</button>
  <button mat-flat-button type="button" [mat-dialog-close]="true">
    Place {{ data.amount | cad }} bid
  </button>
</mat-dialog-actions>
